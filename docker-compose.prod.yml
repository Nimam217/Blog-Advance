services:

  database:
    image: postgres:15
    env_file:
      - .env.prod
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5


  migration:
    build: .
    command: >
      sh -c "./wait-for-it.sh database:5432 --timeout=60 --
      python manage.py migrate"
    env_file:
      - .env.prod
    depends_on:
      database:
        condition: service_healthy
    volumes:
      - .:/app


  backend:
    build: .
    command: >
      sh -c "python manage.py collectstatic --noinput &&
      gunicorn core.wsgi:application --bind 0.0.0.0:8000"
    volumes:
      - .:/app
    expose:
      - "8000"
    depends_on:
      migration:
        condition: service_completed_successfully
    env_file:
      - .env.prod


  redis:
    image: redis
    command: redis-server --save 60 1 --loglevel warning
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5


  celery_worker:
    build: .
    command: celery -A core worker -l INFO
    depends_on:
      migration:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    env_file:
      - .env.prod
    volumes:
      - .:/app


  celery_beat:
    build: .
    command: >
      celery -A core beat -l info
      --scheduler django_celery_beat.schedulers:DatabaseScheduler
    depends_on:
      migration:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    env_file:
      - .env.prod
    volumes:
      - .:/app


  nginx:
    image: nginx:latest
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
      - ./staticfiles:/app/staticfiles
      - ./media:/app/media
    depends_on:
      - backend


volumes:
  postgres_data: