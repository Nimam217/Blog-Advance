name: Django Test

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:

  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: docker compose
      run: docker compose up -d
    - name: run test
      run: docker compose exec backend sh -c "flake8 . && pytest ."
